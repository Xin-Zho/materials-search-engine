topic_id: photopolymerization_shrinkage
name: Photopolymerization Shrinkage & Shrinkage Stress
research_question: >-
  光固化聚合物降低聚合收缩与收缩应力的机制。Mechanisms of reducing polymerization
  shrinkage and shrinkage stress in photocurable / light-cured polymer systems
  (volume change, contraction stress, warpage, dimensional accuracy; dental,
  SLA/DLP 3D-printing, coatings, packaging, adhesives).

