  version: S6_QA_RUBRIC_V1        # freeze 对象；校准改动须升 V2，禁改历史产物
  file: rubric.md                 # 相对本目录；全文 = run_s6_qa.py RUBRIC_SYSTEM_PROMPT
  frozen_at: 2026-09-05
  blind_rules: title+abstract+rubric only; 禁注入 query/family/domain/source

